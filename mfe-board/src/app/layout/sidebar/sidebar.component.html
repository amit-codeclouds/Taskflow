<aside class="sidebar">
  <div class="sidebar-accent-bar"></div>

  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 3h10M2 7h6M2 11h8" stroke="white" stroke-width="1.75" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="logo-text">Taskflow</span>
  </div>

  <div class="sidebar-divider"></div>

  <!-- Workspace indicator -->
  <div class="workspace-indicator-wrap">
    <div class="workspace-indicator">
      <ng-container *ngIf="auth.loading(); else workspaceLoaded">
        <div class="skeleton workspace-indicator-icon"></div>
        <div class="skeleton" style="width:120px;height:12px;flex:1"></div>
      </ng-container>
      <ng-template #workspaceLoaded>
        <div class="workspace-indicator-icon">{{ auth.user().initials[0] ?? 'W' }}</div>
        <span class="workspace-indicator-label">{{ workspaceLabel }}</span>
      </ng-template>
    </div>
  </div>

  <div class="sidebar-section-label">Workspace</div>

  <nav class="sidebar-nav">
    <a href="/" class="nav-item" [class.nav-item--active]="isDashboardActive()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 6.5L8 2l6 4.5V13a1 1 0 01-1 1h-3v-4H6v4H3a1 1 0 01-1-1V6.5z"
          stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
      <span>Dashboard</span>
    </a>
    <a href="/board" class="nav-item" [class.nav-item--active]="isTaskBoardActive()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="1.5" y="2" width="4" height="12" rx="1" stroke="currentColor" stroke-width="1.3"/>
        <rect x="6" y="2" width="4" height="8" rx="1" stroke="currentColor" stroke-width="1.3"/>
        <rect x="10.5" y="2" width="4" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      <span>Task Board</span>
    </a>
  </nav>

  <div class="sidebar-divider" style="margin: 16px;"></div>

  <div class="sidebar-section-label">Tools</div>

  <nav class="sidebar-nav">
    <a href="/tasks" class="nav-item" [class.nav-item--active]="isTasksActive">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/>
        <path d="M5.5 8l1.5 1.5 3.5-3.5" stroke="currentColor" stroke-width="1.3"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>My Tasks</span>
    </a>
  </nav>

  <div class="sidebar-spacer"></div>

  <div class="sidebar-divider"></div>

  <div class="sidebar-bottom-links">
    <a href="/profile" class="nav-item nav-item--sm" [class.nav-item--active]="isProfileActive">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M2.5 14c0-2.5 2.2-4 5.5-4s5.5 1.5 5.5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <span>My Profile</span>
    </a>
    <a href="/settings" class="nav-item nav-item--sm" [class.nav-item--active]="isSettingsActive">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.3"/>
        <path d="M8 1.8v1.6M8 12.6v1.6M14.2 8h-1.6M3.4 8H1.8M12.2 3.8l-1.2 1.2M4.8 11.2l-1.2 1.2M12.2 12.2l-1.2-1.2M4.8 4.8L3.6 3.6"
          stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <span>Settings</span>
    </a>
  </div>

  <div class="sidebar-divider"></div>

  <a href="/settings" class="sidebar-user">
    <app-avatar [avatarUrl]="auth.user().avatarUrl" [initials]="auth.user().initials" [name]="auth.user().name" [loading]="auth.loading()"></app-avatar>
    <div class="user-info" *ngIf="auth.loading(); else userInfoLoaded">
      <div class="skeleton" style="width:90px;height:11px;margin-bottom:6px"></div>
      <div class="skeleton" style="width:130px;height:10px"></div>
    </div>
    <ng-template #userInfoLoaded>
      <div class="user-info">
        <span class="user-name">{{ auth.user().name || 'User' }}</span>
        <span class="user-role">{{ auth.user().email }}</span>
      </div>
    </ng-template>
  </a>
</aside>

<header class="topbar">
  <div class="topbar-title">
    <span class="topbar-title-main">{{ title }}</span>
    <span class="topbar-title-sub">{{ subtitle }}</span>
  </div>

  <div class="topbar-actions">
    <div class="profile-dropdown">
      <button class="profile-trigger" (click)="toggleDropdown()">
        <div class="avatar">{{ auth.user().initials }}</div>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" class="chevron" [class.chevron--open]="open">
          <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="profile-menu" *ngIf="open">
        <div class="profile-menu-header">
          <p class="profile-menu-name">{{ auth.user().name || 'User' }}</p>
          <p class="profile-menu-email">{{ auth.user().email }}</p>
        </div>

        <div class="profile-menu-items">
          <a href="/profile" class="profile-menu-item">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="4.5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M2 12.5c0-2.5 2.2-4 5-4s5 1.5 5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            Profile
          </a>

          <div class="profile-menu-divider"></div>

          <a href="/settings" class="profile-menu-item">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.3"/>
              <path d="M7 1.5v1.4M7 11.1v1.4M12.5 7h-1.4M2.9 7H1.5M10.7 3.3l-1 1M4.3 9.7l-1 1M10.7 10.7l-1-1M4.3 4.3l-1-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            Settings
          </a>

          <div class="profile-menu-divider"></div>

          <button class="profile-menu-item profile-menu-item--danger" (click)="logout()" [disabled]="loggingOut">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M5.5 2H3a1 1 0 00-1 1v8a1 1 0 001 1h2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9 9.5L12 7l-3-2.5M5.5 7h6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            {{ loggingOut ? 'Signing out…' : 'Sign out' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

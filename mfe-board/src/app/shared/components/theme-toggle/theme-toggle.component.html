<button
  type="button"
  role="switch"
  class="theme-toggle"
  [attr.aria-checked]="theme.theme() === 'light'"
  [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
  (click)="theme.toggle()"
>
  <svg *ngIf="theme.theme() === 'dark'" width="16" height="16" viewBox="0 0 16 16" fill="none">
    <path d="M13.5 9.2A5.7 5.7 0 016.8 2.5 5.7 5.7 0 1013.5 9.2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  </svg>
  <svg *ngIf="theme.theme() === 'light'" width="16" height="16" viewBox="0 0 16 16" fill="none">
    <circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.3"/>
    <path d="M8 1.3v1.6M8 13.1v1.6M14.7 8h-1.6M2.9 8H1.3M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1M12.7 12.7l-1.1-1.1M4.4 4.4L3.3 3.3"
      stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </svg>
</button>

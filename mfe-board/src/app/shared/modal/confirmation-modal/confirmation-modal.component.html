<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <h3 class="modal-title">{{ title }}</h3>

    <!-- Message input, or projected content for a richer body -->
    <p class="modal-message" *ngIf="message">{{ message }}</p>
    <ng-content></ng-content>

    <div class="modal-actions">
      <button
        *ngIf="showCancel"
        type="button"
        class="modal-btn modal-btn--ghost"
        (click)="onCancel()"
        [disabled]="loading"
      >
        {{ cancelText }}
      </button>
      <button
        type="button"
        class="modal-btn"
        [class.modal-btn--danger]="variant === 'danger'"
        [class.modal-btn--primary]="variant !== 'danger'"
        (click)="onConfirm()"
        [disabled]="loading"
      >
        {{ loading ? 'Please wait…' : confirmText }}
      </button>
    </div>
  </div>
</div>

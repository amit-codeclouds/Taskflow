<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <h3 class="modal-title">
      Add status<span *ngIf="teamName"> to {{ teamName }}</span>
    </h3>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="modal-form">
      <!-- Name -->
      <div class="field">
        <label class="field-label" for="cs-name">Name</label>
        <input id="cs-name" class="field-input" formControlName="name" placeholder="e.g. In Review" />
        <p class="field-error" *ngIf="f['name'].touched && f['name'].errors?.['required']">Name is required</p>
        <p class="field-error" *ngIf="f['name'].errors?.['maxlength']">Max 50 characters</p>
      </div>

      <!-- Description -->
      <div class="field">
        <label class="field-label" for="cs-desc">Description</label>
        <textarea id="cs-desc" class="field-input" formControlName="description" rows="2" placeholder="Optional"></textarea>
      </div>

      <!-- Position -->
      <div class="field">
        <label class="field-label" for="cs-pos">Position</label>
        <input id="cs-pos" class="field-input" type="number" formControlName="position" />
        <p class="field-error" *ngIf="f['position'].touched && f['position'].errors">Enter a valid position (0 or more)</p>
      </div>

      <!-- Team ID (read-only, prefilled) -->
      <div class="field">
        <label class="field-label" for="cs-team">Team ID</label>
        <input id="cs-team" class="field-input" formControlName="teamId" readonly />
      </div>

      <!-- Is archievable -->
      <label class="field-checkbox">
        <input type="checkbox" formControlName="isArchievable" />
        <span>Is archievable</span>
      </label>

      <p class="modal-error" *ngIf="errorMsg">{{ errorMsg }}</p>

      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn--ghost" (click)="onCancel()" [disabled]="saving">Cancel</button>
        <button type="submit" class="modal-btn modal-btn--primary" [disabled]="saving || form.invalid">
          {{ saving ? 'Adding…' : 'Add Status' }}
        </button>
      </div>
    </form>
  </div>
</div>
